[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narameter"
version = "0.1.0"
description = "Deteksi Perubahan Narasi Publik Menggunakan Distribusi Embedding Teks dan Wasserstein Distance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "narameter"},
]

dependencies = [
    "sentence-transformers>=3.0",
    "POT>=0.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "click>=8.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "twikit>=1.3,<1.4",  # 1.4+ requires Python 3.10+ syntax
    "Sastrawi>=1.0",
    "rich>=13.0",
    "kaleido>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
narameter = "narameter.cli:cli"

[tool.setuptools.packages.find]
include = ["narameter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
